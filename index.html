<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার বন্ধু - তোমার পরম আপনজন</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-50 text-slate-800 font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="bg-teal-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">আমার বন্ধু</h1>
        <span class="text-sm bg-teal-700 px-3 py-1 rounded-full">তোমার পরম আপনজন</span>
    </nav>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Welcome Banner -->
        <div class="bg-white p-6 rounded-2xl shadow-sm text-center border border-teal-100">
            <h2 class="text-xl font-bold text-teal-800 mb-2">স্বাগতম! কেমন আছো আজ?</h2>
            <p class="text-sm text-gray-600">এখানে তুমি সম্পূর্ণ নিরাপদে তোমার অনুভূতির কথা প্রকাশ করতে পারো।</p>
        </div>

        <!-- Mood Tracker Section -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-teal-100">
            <h3 class="font-semibold text-lg text-teal-900 mb-3">আজকের অনুভূতি কেমন?</h3>
            <div class="flex justify-between text-2xl">
                <button onclick="selectMood('খুব ভালো')" class="p-3 hover:bg-teal-50 rounded-xl transition">😊</button>
                <button onclick="selectMood('শান্ত')" class="p-3 hover:bg-teal-50 rounded-xl transition">😌</button>
                <button onclick="selectMood('চিন্তিত')" class="p-3 hover:bg-teal-50 rounded-xl transition">😟</button>
                <button onclick="selectMood('খুব খারাপ')" class="p-3 hover:bg-teal-50 rounded-xl transition">😢</button>
            </div>
            <p id="mood-status" class="mt-3 text-sm text-center text-teal-700 font-medium"></p>
        </div>

        <!-- ADHD Focus Zone Preview -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-teal-100 text-center">
            <h3 class="font-semibold text-lg text-teal-900 mb-2">⚡ ADHD ফোকাস জোন</h3>
            <p class="text-xs text-gray-500 mb-4">মনোযোগ ধরে রাখতে ব্রিদিং ও পমোডোরো টুলস</p>
            <button onclick="alert('পরবর্তী আপডেটে পমোডোরো টাইমার যোগ হচ্ছে!')" class="bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">স্টার্ট ফোকাস Session</button>
        </div>

        <!-- Crisis Helpline -->
        <div class="bg-rose-50 border border-rose-200 p-4 rounded-2xl text-center">
            <p class="text-xs text-rose-700 mb-2 font-medium">জরুরি মানসিক সাহায্যের জন্য সরাসরি কথা বলো</p>
            <a href="tel:01779554391" class="inline-block bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow hover:bg-rose-700 transition">
                জরুরি হেল্পলাইন (কান পেতে রই)
            </a>
        </div>

    </main>

    <script>
        function selectMood(mood) {
            document.getElementById('mood-status').innerText = "তুমি আজকে '" + mood + "' অনুভূতি সিলেক্ট করেছো।";
        }
    </script>
</body>
</html>
